name: Build Gopeed Plugin and Commit

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build plugin
        run: npm run build

      - name: Commit build artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: dist/**/*
          commit_message: "chore(build): Auto-generated build artifacts [skip ci]"
          commit_author: "GitHub Actions <actions@github.com>"
          branch: ${{ github.ref_name }}
          skip_ci: true